<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Joshua Tarara — Mechanical Engineering" />
  <title>Joshua Tarara — Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --surface: #0a0a0b;
      --ink: #f5f4ef;
      --muted: rgba(245, 244, 239, .66);
      --hairline: rgba(255, 255, 255, .26);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--surface); }
    body {
      display: grid;
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 86% 48% at -8% -4%, rgba(226, 61, 27, .72), transparent 74%),
        radial-gradient(ellipse 75% 57% at 100% 4%, rgba(35, 77, 213, .78), transparent 74%),
        radial-gradient(ellipse 70% 48% at 51% 24%, rgba(167, 19, 111, .59), transparent 74%),
        linear-gradient(180deg, #211014 0%, #21111b 22%, #1e1b23 38%, #1b1b1d 59%, #1b1b1d 100%);
      color: var(--ink);
      font-family: "DM Sans", Arial, sans-serif;
      isolation: isolate;
    }
    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      content: "";
      opacity: .18;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.78'/%3E%3C/svg%3E");
    }
    main {
      width: min(100%, 33rem);
      padding: clamp(2rem, 8vw, 4.5rem) 1.35rem 2rem;
      text-align: center;
    }
    .identity { margin-bottom: clamp(2.6rem, 7vw, 4rem); }
    .portrait {
      display: block;
      width: clamp(6.2rem, 23vw, 7.5rem);
      aspect-ratio: 1;
      margin: 0 auto 1.6rem;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.54);
      border-radius: 50%;
      background: #151517;
      box-shadow: 0 1.25rem 3.5rem rgba(0,0,0,.33);
    }
    .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    h1 { margin: 0; font-size: clamp(2.35rem, 9.5vw, 3.45rem); font-weight: 300; letter-spacing: -.075em; line-height: .95; }
    .role { margin: .85rem 0 0; color: var(--muted); font-size: .72rem; font-weight: 500; letter-spacing: .19em; text-transform: uppercase; }
    .location { margin: .8rem 0 0; color: rgba(245,244,239,.5); font-size: .76rem; letter-spacing: .08em; }
    .links { display: grid; gap: .75rem; }
    .link {
      display: flex;
      min-height: 4.25rem;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border: 1px solid var(--hairline);
      padding: .85rem 1.15rem .85rem 1.3rem;
      color: var(--ink);
      background: rgba(10,10,11,.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: left;
      transition: color 180ms ease, background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }
    .link:hover { border-color: #f5f4ef; background: #f5f4ef; color: #0a0a0b; transform: translateY(-2px); }
    .link-title { font-size: 1.02rem; font-weight: 400; letter-spacing: -.025em; }
    .arrow { display: grid; width: 2.1rem; height: 2.1rem; flex: 0 0 auto; place-items: center; border: 1px solid currentColor; border-radius: 50%; }
    .arrow svg { width: 1rem; height: 1rem; }
    .footer { margin: 2.5rem 0 0; color: rgba(245,244,239,.54); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; }
    .footer a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; }
    .footer a:hover { border-color: currentColor; }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
  </style>
</head>
<body>
  <main>
    <section class="identity" aria-label="Joshua Tarara">
      <span class="portrait"><img src="/assets/headshot.png" alt="Joshua Tarara" /></span>
      <h1>Joshua Tarara</h1>
      <p class="role">Mechanical Engineering Student</p>
      <p class="location">Boston, MA + Space Coast, FL</p>
    </section>
    <nav class="links" aria-label="Joshua Tarara links">
      <a class="link" href="/"><span class="link-title">Portfolio Website</span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13" /><path d="m13 6 6 6-6 6" /></svg></span></a>
      <a class="link" href="/#projects"><span class="link-title">Featured Projects</span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13" /><path d="m13 6 6 6-6 6" /></svg></span></a>
      <a class="link" href="https://linkedin.com/in/tararadotjoshua" target="_blank" rel="noreferrer"><span class="link-title">LinkedIn · tararadotjoshua</span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13" /><path d="m13 6 6 6-6 6" /></svg></span></a>
      <a class="link" href="mailto:Tararajoshua@gmail.com"><span class="link-title">Email</span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13" /><path d="m13 6 6 6-6 6" /></svg></span></a>
    </nav>
    <p class="footer"><a href="/">© 2026 Joshua Tarara</a></p>
  </main>
</body>
</html>
